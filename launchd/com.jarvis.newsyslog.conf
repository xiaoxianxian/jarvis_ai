# newsyslog config for jarvis logs (macOS).
# Install: sudo cp launchd/com.jarvis.newsyslog.conf /etc/newsyslog.d/
# Rotates when a log exceeds 10 MB, keeps 5 archives (gzip), then deletes oldest.
# log_file_size_1M makes the size column count in 1 MB units.
log_file_size_1M
/Users/xiaota/Library/Logs/jarvis-voice.log     644  5     10240 *     J
/Users/xiaota/Library/Logs/jarvis-dashboard.log 644  5     10240 *     J
